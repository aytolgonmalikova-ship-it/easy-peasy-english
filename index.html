<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF9EC" />
    <meta
      name="description"
      content="Easy Peasy English — playful English courses for kids 4–12 in Bishkek."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Easy Peasy English</title>
    <script>
      // Apply saved (or system) theme before first paint to avoid a light flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('epe-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.style.colorScheme = theme;
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1A1C2C');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
